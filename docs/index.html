    <style rel="stylesheet" crossorigin>:root{--bg: #ffffff;--fg: #1c1c1a;--muted: #61615c;--border: #dcdcd6;--panel: #f7f7f4;--field: #ffffff}@media(prefers-color-scheme:dark){:root{--bg: #101317;--fg: #e4e7ea;--muted: #98a1ab;--border: #2b313a;--panel: #171b21;--field: #1e232a}}*{box-sizing:border-box}body{margin:0;padding:1rem 0 3rem;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Hiragino Sans,Noto Sans JP,sans-serif;font-size:15px;line-height:1.7}.wrap{max-width:960px;margin:0 auto;padding:0 1rem}h1{font-size:1.3rem;margin:0}.header{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.6rem}.lang{font-size:.85em;padding:.25rem .6rem}.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:.85rem 1rem;margin-bottom:1rem}.row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.4rem 0}.row>label{flex:0 0 auto;font-weight:600}.unit{color:var(--muted)}.readouts{font-variant-numeric:tabular-nums;color:var(--muted)}.readouts strong{color:var(--fg)}.sep{color:var(--border)}.note{margin:.2rem 0 .6rem;color:var(--muted);font-size:.9em}.toggles{gap:1rem}.toggles label{display:inline-flex;align-items:center;gap:.35rem;cursor:pointer}button,select,input[type=number]{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--border);border-radius:4px;padding:.35rem .7rem;cursor:pointer}input[type=number]{width:5.5em;cursor:text;text-align:right}button:hover,select:hover{border-color:var(--muted)}button[aria-pressed=true]{border-color:var(--fg);font-weight:600}.proj-row{margin:.3rem 0}.family-label{flex:0 0 auto;min-width:4.5em;color:var(--muted);font-size:.9em}.proj[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.map-wrap{margin-bottom:1rem}.inline-field{display:inline-flex;align-items:center;gap:.5rem;margin-left:.75rem}.inline-field>label{font-weight:600}#map{display:block;width:100%;height:auto;touch-action:pan-y;cursor:gra   </head>
  <body>
    <header class="wrap header">
      <h1 data-i18n="title">イコールアース図法ビューア</h1>
      <button id="lang-toggle" class="lang" type="button" data-i18n="lang.switch" data-i18n-aria="lang.switch.aria">English</button>
    </header>

    <div class="wrap map-wrap">
      <svg id="map" role="img" data-i18n-aria="map.aria" aria-label="選択した図法で描いた世界地図"></svg>
    </div>

    <section class="wrap panel" data-i18n-aria="panel.lon.aria" aria-label="中央経線の操作">
      <div class="row">
        <label for="lon-number" data-i18n="lon.label">中央経線</label>
        <input
          id="lon-number"
          type="number"
          min="-180"
          max="180"
          step="1"
          value="-90"
          data-i18n-aria="lon.number.aria" aria-label="中央経線(度)"
        />
        <span class="unit">°</span>
        <span id="lat-row" class="inline-field" hidden>
        <label for="lat-number" data-i18n="lat.label">中心緯度</label>
        <input
          id="lat-number"
          type="number"
          min="-90"
          max="90"
          step="1"
          value="0"
          data-i18n-aria="lat.number.aria" aria-label="中心緯度(度)"
        />
        <span class="unit">°</span>
        </span>
      </div>

      <div class="row readouts">
        <span><span data-i18n="readout.center">中央</span> <strong id="lon-readout">—</strong><span id="lat-readout-wrap" hidden> / <strong id="lat-readout">—</strong></span></span>
        <span class="sep">/</span>
        <span><span data-i18n="readout.seam">裂け目</span> <strong id="seam-readout">—</strong></span>
      </div>

      <div class="row">
        <button class="preset" type="button" data-lon="-90" data-i18n="preset.americas">アメリカ中心 西経90°</button>
        <button class="preset" type="button" data-lon="150" data-i18n="preset.pacific">太平洋中心 東経150°</button>
        <button class="preset" type="button" data-lon="0" data-i18n="preset.europe">ヨーロッパ・アフリカ中心 0°</button>
        <button id="spin" type="button" aria-pressed="false">回す</button>
      </div>
      <div id="lat-presets" class="row" hidden>
        <button class="preset-lat" type="button" data-lat="0" data-i18n="preset.lat.equator">赤道中心 0°</button>
        <button class="preset-lat" type="button" data-lat="90" data-i18n="preset.lat.north">北極中心 北緯90°</button>
        <button class="preset-lat" type="button" data-lat="-90" data-i18n="preset.lat.south">南極中心 南緯90°</button>
      </div>
      <p id="drag-hint" class="note" data-i18n="drag.hint">地図を左右にドラッグ (スワイプ) しても回せます。</p>
    </section>

    <section class="wrap panel" data-i18n-aria="panel.view.aria" aria-label="表示の設定">
      <div id="proj-list" role="group" data-i18n-aria="proj.label" aria-label="図法"></div>
      <p id="proj-note" class="note">—</p>

      <div class="row toggles">
        <label><input type="checkbox" id="toggle-land" checked /> <span data-i18n="toggle.land">陸地</span></label>
        <label><input type="checkbox" id="toggle-graticule" checked /> <span data-i18n="toggle.graticule">経緯線</span></label>
        <label><input type="checkbox" id="toggle-tissot" /> <span data-i18n="toggle.tissot">ティソーの指示楕円</span></label>
      </div>

      <div class="row">
        <button id="export-svg" type="button" data-i18n="export.svg">SVG を保存</button>
        <button id="export-png" type="button" data-i18n="export.png">PNG を保存 (2x)</button>
      </div>
    </section>

    <footer class="wrap">
      <p data-i18n-html="footer.tissot">
        ティソーの指示楕円は半径約 500 km の円を 30° 間隔に並べたものです。
        どの図法も正積なので<strong>どの円も面積が等しく</strong>、形の崩れだけが歪みとして現れます。
      </p>
      <p class="src" data-i18n-html="footer.src">
        図法: イコールアース = Šavrič, Patterson &amp; Jenny, <em>Int. J. Geogr. Inf. Sci.</em> 33, 454 (2019; 2018 年公開) ／
        描画: d3-geo ／ 海岸線: Natural Earth (world-atlas 110m)
      </p>
    </footer>

  </body>
</html>
