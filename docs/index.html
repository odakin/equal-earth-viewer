    <style rel="stylesheet" crossorigin>:root{--bg: #ffffff;--fg: #1c1c1a;--muted: #61615c;--border: #dcdcd6;--panel: #f7f7f4;--field: #ffffff}@media(prefers-color-scheme:dark){:root{--bg: #101317;--fg: #e4e7ea;--muted: #98a1ab;--border: #2b313a;--panel: #171b21;--field: #1e232a}}*{box-sizing:border-box}body{margin:0;padding:1rem 0 3rem;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Hiragino Sans,Noto Sans JP,sans-serif;font-size:15px;line-height:1.7}.wrap{max-width:960px;margin:0 auto;padding:0 1rem}h1{font-size:1.3rem;margin:0 0 .6rem}.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:.85rem 1rem;margin-bottom:1rem}.row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.4rem 0}.row>label{flex:0 0 auto;font-weight:600}.grow{flex:1 1 180px;min-width:140px}.unit{color:var(--muted)}.readouts{font-variant-numeric:tabular-nums;color:var(--muted)}.readouts strong{color:var(--fg)}.sep{color:var(--border)}.note{margin:.2rem 0 .6rem;color:var(--muted);font-size:.9em}.toggles{gap:1rem}.toggles label{display:inline-flex;align-items:center;gap:.35rem;cursor:pointer}button,select,input[type=number]{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--border);border-radius:4px;padding:.35rem .7rem;cursor:pointer}input[type=number]{width:5.5em;cursor:text;text-align:right}input[type=range]{accent-color:#4a7fa5}button:hover,select:hover{border-color:var(--muted)}button[aria-pressed=true]{border-color:var(--fg);font-weight:600}.map-wrap{margin-bottom:1rem}#map{display:block;width:100%;height:auto;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}#map.dragging{cursor:grabbing}footer{color:var(--muted);font-size:.85em}footer p{margin:.4rem 0}.src{font-size:.95em}@media(max-width:480px){body{font-size:14px}.row{gap:.4rem}.row>label{order:-2}.grow{flex:1 1 100%;order:-1}button{padding:.4rem .6rem}}</style>
  </head>
  <body>
    <header class="wrap">
      <h1>Equal Earth 図法ビューア</h1>
    </header>

    <div class="wrap map-wrap">
      <svg id="map" role="img" aria-label="選択した図法で描いた世界地図"></svg>
    </div>

    <section class="wrap panel" aria-label="中央経線の操作">
      <div class="row">
        <label for="lon-slider">中央経線</label>
        <input id="lon-slider" class="grow" type="range" min="-180" max="180" step="1" value="-90" />
        <input
          id="lon-number"
          type="number"
          min="-180"
          max="180"
          step="1"
          value="-90"
          aria-label="中央経線(度)"
        />
        <span class="unit">°</span>
      </div>

      <div class="row readouts">
        <span>中央 <strong id="lon-readout">—</strong></span>
        <span class="sep">/</span>
        <span>裂け目 <strong id="seam-readout">—</strong></span>
      </div>

      <div class="row">
        <button class="preset" type="button" data-lon="-90">アメリカ中心 90°W</button>
        <button class="preset" type="button" data-lon="150">太平洋中心 150°E</button>
        <button class="preset" type="button" data-lon="10">ヨーロッパ・アフリカ中心 10°E</button>
        <button id="spin" type="button" aria-pressed="false">回す</button>
      </div>
      <p class="note">地図を左右にドラッグ (スワイプ) しても回せます。</p>
    </section>

    <section class="wrap panel" aria-label="表示の設定">
      <div class="row">
        <label for="proj-select">図法</label>
        <select id="proj-select"></select>
      </div>
      <p id="proj-note" class="note">—</p>

      <div class="row toggles">
        <label><input type="checkbox" id="toggle-land" checked /> 陸地</label>
        <label><input type="checkbox" id="toggle-graticule" checked /> 経緯線</label>
        <label><input type="checkbox" id="toggle-tissot" /> ティソーの指示楕円</label>
      </div>

      <div class="row">
        <button id="export-svg" type="button">SVG を保存</button>
        <button id="export-png" type="button">PNG を保存 (2x)</button>
      </div>
    </section>

    <footer class="wrap">
      <p>
        ティソーの指示楕円は半径約 500 km の円を 30° 間隔に並べたものです。
        どの図法も正積なので<strong>どの円も面積が等しく</strong>、形の崩れだけが歪みとして現れます。
      </p>
      <p class="src">
        図法: Šavrič, Patterson &amp; Jenny (2018), <em>Int. J. Geogr. Inf. Sci.</em> ／
        描画: d3-geo ／ 海岸線: Natural Earth (world-atlas 110m)
      </p>
    </footer>

  </body>
</html>
